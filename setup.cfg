[flake8]
# Игнорируемые ошибки
ignore = 
    # E501 - слишком длинная строка (проверяем отдельно)
    E501
    # E203 - пробелы вокруг оператора в slicing (проблемы с PEP 8)
    E203
    # W503 - перенос строки перед бинарным оператором
    W503
    # E402 - импорт не в начале файла
    E402

# Максимальная длина строки
max-line-length = 100

# Исключаемые директории и файлы
exclude = 
    .git,
    __pycache__,
    venv,
    .pytest_cache,
    .venv,
    env,
    build,
    dist,
    *.egg-info

# Стиль оформления
per-file-ignores = 
    __init__.py:F401  # игнорировать неиспользуемые импорты в __init__.py
    tests/*:E501      # разрешить длинные строки в тестах

# Проверка docstring
docstring-convention = google

# Число процессов для проверки
jobs = 4

# Уровень важности ошибок
select = E,W,F,C

# Максимальная сложность функций
max-complexity = 10


[pytest]
# Путь к папке с тестами
testpaths = tests

# Паттерны для поиска тестов
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Опции запуска
addopts = 
    -v
    --tb=short
    --strict-markers
    --capture=sys
    --maxfail=1

# Маркеры
markers =
    unit: Модульные тесты
    integration: Интеграционные тесты
    slow: Медленные тесты
    smoke: Дымовые тесты


[mypy]
# Путь к файлам
mypy_path = .
python_version = 3.9

# Строгие проверки
strict = False
disallow_untyped_defs = False
check_untyped_defs = True
ignore_missing_imports = True
allow_redefinition = True

# Исключения
exclude = 
    venv/
    .pytest_cache/
    tests/


[coverage:run]
# Что покрывать тестами
source = .
omit = 
    */venv/*
    */tests/*
    */__pycache__/*

# Параметры запуска
parallel = True
concurrency = multiprocessing


[coverage:report]
# Форматы отчёта
show_missing = True
precision = 2
skip_covered = False

# Исключения из отчёта
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if __name__ == .__main__.:
    raise NotImplementedError
    pass


[tool:pytest]
# Альтернативная секция для pytest
minversion = 7.0
testpaths = tests
addopts = -ra -q --strict-markers


[pep8]
# Настройки PEP 8 (устаревший инструмент)
max-line-length = 100
ignore = E501,E203,W503
exclude = venv,__pycache__,.git


[isort]
# Настройки сортировки импортов
line_length = 100
multi_line_output = 3
include_trailing_comma = True
force_grid_wrap = 0
use_parentheses = True
ensure_newline_before_comments = True
lines_between_types = 1
known_first_party = 
    fit_life
known_third_party = 
    pytest
sections = FUTURE,STDLIB,THIRDPARTY,FIRSTPARTY,LOCALFOLDER
default_section = THIRDPARTY
